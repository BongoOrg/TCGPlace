<ion-content>
  <ion-refresher mode="ios" slot="fixed" [pullFactor]="0.5" [pullMin]="100" [pullMax]="200"  (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content pullingIcon="refresh-outline"></ion-refresher-content>
  </ion-refresher>
  <ion-grid [fixed]="true">
    <ion-grid>
      <ng-container *ngIf="list && list.length; else noPosts">
        <ion-row>
          <ion-col size="6" *ngFor="let post of list; index as position">
            <app-sale-post-card [salePost]="post"></app-sale-post-card>
          </ion-col>
        </ion-row>
      </ng-container>
      <ion-infinite-scroll *ngIf="!isLoading" threshold="100px" (ionInfinite)="onIonInfinite($event)">
        <ion-infinite-scroll-content
          loading-spinner="bubbles"
          loading-text="Loading ..">
        </ion-infinite-scroll-content>
      </ion-infinite-scroll>
    </ion-grid>

    <ng-template #noPosts>
      <div *ngIf="!isLoading && !errorOccurred">
        Aucune annonce trouvée.
      </div>
    </ng-template>
  </ion-grid>

  <ng-template [ngIf]="isLoading && !errorOccurred">
    <app-skeleton-grid></app-skeleton-grid>
  </ng-template>

  <ng-template [ngIf]="errorOccurred">
    <div class="error-occurred">
      <img src="https://pbs.twimg.com/media/D5WVXQHXkAE_Wzn.png" width="150px">
      <p>Une erreur est survenue</p>
      <ion-button (click)="refresh()">Recharger la page</ion-button>
    </div>

  </ng-template>
</ion-content>
