<div class="tile-container">
  <h2 class="pl-1">Extensions</h2>
  <a (click)="navigateTo('')">Tout voir →</a>
</div>
<swiper-container space-between="30" slides-per-view="auto" free-mode="true">
  <swiper-slide *ngFor="let extension of this.extensions$ | async" style="width:200px">
    <app-extension-card (click)="navigateTo(extension.id)" [extension]="extension"></app-extension-card>
  </swiper-slide>
</swiper-container>
