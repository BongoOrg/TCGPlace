<div class="tile-container">
  <h2 class="pl-1">Extensions</h2>
  <a (click)="navigateTo('')">Tout voir →</a>
</div>
<div *ngIf="extensions$ | async as extensions; else loading">
  <swiper-container space-between="30" slides-per-view="auto" free-mode="true">
    <swiper-slide *ngFor="let extension of extensions" style="width:200px">
      <app-extension-card (click)="navigateTo(extension.id)" [extension]="extension"></app-extension-card>
    </swiper-slide>
  </swiper-container>
</div>
<ng-template #loading>
  <ion-grid [fixed]="true">
    <ion-grid>
      <ion-row>
        <ion-col size="5" *ngFor="let skeleton of skeletons; index as position">
          <ion-label style="display: flex; flex-direction: row; margin-left: 10px">
            <ion-thumbnail slot="start" style="width: 30px; height: 30px">
              <ion-skeleton-text [animated]="true"></ion-skeleton-text>
            </ion-thumbnail>
            <p>
              <ion-skeleton-text [animated]="true" style="width: 700%; height: 20px; margin-left: 10px"></ion-skeleton-text>
            </p>
          </ion-label>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-grid>
</ng-template>
