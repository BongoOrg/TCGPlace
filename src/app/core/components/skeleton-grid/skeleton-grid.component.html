<ion-grid [fixed]="true">
	<ion-grid>
		<ion-row>
			<ion-col size="6" *ngFor="let skeleton of skeletons; index as position">
				<div class="postCard">
					<ion-label>
						<ion-thumbnail slot="start" style="width: 100%; min-height: 14rem">
							<ion-skeleton-text [animated]="true"></ion-skeleton-text>
						</ion-thumbnail>
						<h3>
							<ion-skeleton-text
								[animated]="true"
								style="width: 80%; margin-bottom: 5px; margin-top: 10px"
							></ion-skeleton-text>
						</h3>
						<p>
							<ion-skeleton-text
								[animated]="true"
								style="width: 60%; margin-bottom: 5px"
							></ion-skeleton-text>
						</p>
						<p>
							<ion-skeleton-text
								[animated]="true"
								style="width: 30%; margin-bottom: 10px"
							></ion-skeleton-text>
						</p>
					</ion-label>
				</div>
			</ion-col>
		</ion-row>
	</ion-grid>
</ion-grid>
