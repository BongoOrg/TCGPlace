<ion-card class="container" (click)="redirectToAddPost(salePost.id)">
	<img [src]="salePost.salePicturePosts[0]" />
	<ion-card-content>
		<ion-grid>
			<ion-row class="ion-align-items-center">
				<ion-col size="9">
					<h2>{{ salePost.price }} €</h2>
					<h3>{{ salePost.name }}</h3>
				</ion-col>
				<ion-col size="3">
					<div *ngIf="!isOwner">
						<ion-icon
							*ngIf="!this.salePost.liked"
							name="heart-outline"
							size="large"
							(click)="LikeSalePost(this.salePost.id, $event)"
						></ion-icon>
						<ion-icon
							*ngIf="this.salePost.liked"
							name="heart"
							color="danger"
							size="large"
							(click)="UnLikeSalePost(this.salePost.id, $event)"
						></ion-icon>
					</div>
				</ion-col>
			</ion-row>
		</ion-grid>
		<h4>{{ salePost.libelleExtension }}</h4>
	</ion-card-content>
</ion-card>
