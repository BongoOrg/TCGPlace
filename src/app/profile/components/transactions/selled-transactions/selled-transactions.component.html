<ion-content>
  <ng-container *ngIf="isLoading$ | async; else loaded">
    <div class="spin">
      <ion-spinner name="crescent" color="secondary" style="margin-top: 10px"></ion-spinner>
    </div>
  </ng-container>

  <ng-template #loaded>
    <ng-container *ngIf="(sellerTransaction$ | async) as sellerTransaction">
      <ion-grid class="grid-container" *ngIf="sellerTransaction.length > 0; else noTransactions">
        <ion-row class="row-divider" *ngFor="let transaction of sellerTransaction$ | async" (click)="onTransactionClick(transaction)">
          <ion-col size="2">
            <ion-img src="{{transaction.merchPostNamePhotos[0]}}"></ion-img>
          </ion-col>
          <ion-col size="2" class="order-icon">
            <ion-icon size="large" name="time-outline"></ion-icon>
          </ion-col>
          <ion-col size="6">
            <ion-grid class="order-detail">
              <ion-row>
                <ion-col>
                  <h2>{{transaction.merchPostName}}</h2>
                </ion-col>
              </ion-row>
              <ion-row>
                <ion-col>
                  <h3>Commandé</h3>
                </ion-col>
              </ion-row>
              <ion-row>
                <ion-col>
                  <h4>{{transaction.buyDate | date:'dd/MM/yyyy'}}</h4>
                </ion-col>
              </ion-row>
            </ion-grid>
          </ion-col>
          <ion-col class="order-price">
            <h2>20 €</h2>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ng-container>
    <ng-template #noTransactions>
      <p>Il n'y a pas de transactions à afficher.</p>
    </ng-template>
  </ng-template>
</ion-content>
